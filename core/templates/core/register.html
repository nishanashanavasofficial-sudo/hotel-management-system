<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account | GrandStay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 360px; }
        .card h2 { color: #1e3c72; margin-bottom: 20px; text-align: center; }
        .card form p { margin-bottom: 15px; font-size: 0.9rem; }
        .card form input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-top: 5px; box-sizing: border-box; }
        .btn { background: #1e3c72; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #2a5298; }
        .login-link { text-align: center; margin-top: 15px; font-size: 0.85rem; }
        .login-link a { color: #1e3c72; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Create Account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Register & Log In</button>
        </form>
        <div class="login-link">
            Already have an account? <a href="/admin/login/">Log in here</a>
        </div>
    </div>
</body>
</html>
